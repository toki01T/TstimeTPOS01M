<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>T's time - アプリに戻る</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: #f1f5f9;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 360px;
            padding: 28px 22px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.15rem;
        }

        p {
            margin: 0 0 18px;
            color: #475569;
            font-size: 0.92rem;
            line-height: 1.7;
        }

        a.button {
            display: block;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        a.button.secondary {
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #334155;
        }

        .hint {
            margin-bottom: 0;
            font-size: 0.82rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>印刷が完了しました</h1>
        <p id="status">下のボタンでアプリに戻れます。</p>
        <a class="button" id="retry" href="#">アプリに戻る</a>
        <a class="button secondary" id="retryAlt" href="#">別の形式で戻る</a>
        <p class="hint">戻れない場合はホーム画面の「T's time」アイコンから開き直してください。入力内容と連番は残っています。</p>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var target = params.get('to') || '';
            var alternate = params.get('alt') || '';

            var retry = document.getElementById('retry');
            var retryAlt = document.getElementById('retryAlt');
            retry.href = target || '#';
            retryAlt.href = alternate || '#';
            if (!alternate || alternate === target) retryAlt.style.display = 'none';

            if (!target) return;

            // webapp:// に location で飛ぶと、iOSが対応していない場合に
            // このページごとエラー画面へ差し替えられ、手動で戻る導線まで消えてしまう。
            // iframe から開けば、失敗してもこのページは残る
            var opener = document.createElement('iframe');
            opener.style.display = 'none';
            opener.src = target;
            document.body.appendChild(opener);

            setTimeout(function () {
                opener.remove();
            }, 1200);
        })();
    </script>
</body>
</html>
