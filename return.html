<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>T's time - Webアプリに戻る</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: #f1f5f9;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 360px;
            padding: 28px 22px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.15rem;
        }

        p {
            margin: 0 0 18px;
            color: #475569;
            font-size: 0.92rem;
            line-height: 1.7;
        }

        a.button {
            display: block;
            margin-bottom: 10px;
            padding: 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
        }

        a.button.secondary {
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 0.95rem;
            padding: 14px;
        }

        .hint {
            margin-bottom: 0;
            font-size: 0.82rem;
            color: #64748b;
        }

        details {
            margin-top: 16px;
            text-align: left;
        }

        summary {
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            color: #2563eb;
        }

        details ol {
            margin: 12px 0 0;
            padding-left: 1.2em;
            color: #475569;
            font-size: 0.82rem;
            line-height: 1.8;
        }

        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            background: #f1f5f9;
            padding: 1px 5px;
            border-radius: 5px;
            word-break: break-all;
        }

        .target {
            margin: 16px 0 0;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 0.7rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="title">印刷が完了しました</h1>
        <p id="status">ホーム画面のWebアプリへ戻しています…</p>

        <a class="button" id="openWebApp" href="#">Webアプリに戻る</a>
        <a class="button secondary" id="openShortcut" href="#">ショートカットで戻る</a>
        <a class="button secondary" id="openHomeHint" href="#">ホーム画面のアイコンから開く</a>

        <p class="hint">Safariのサイトではなく、ホーム画面の「T's time」Webアプリへ戻ります。入力・連番はそのまま残っています。</p>

        <details>
            <summary>初回だけ：ショートカットの作り方</summary>
            <ol>
                <li>「ショートカット」アプリで新規作成</li>
                <li>「URL」に次を貼り付け<br><code id="webappUrl"></code></li>
                <li>「URLを開く」を追加</li>
                <li>名前を <code id="scName"></code> にして保存</li>
            </ol>
        </details>

        <p class="target" id="target"></p>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var webappPrimary = params.get('to') || '';
            var webappAlt = params.get('alt') || '';
            var httpsApp = params.get('https') || '';
            var shortcutName = params.get('sc') || 'Tstime';
            var from = params.get('from') || '';
            var shortcutUrl = 'shortcuts://run-shortcut?name=' + encodeURIComponent(shortcutName);

            // manifest start_url に合わせた既定値
            if (!/^webapp:/i.test(webappPrimary)) {
                webappPrimary = 'webapp://toki01t.github.io/TstimeTPOS01M/index.html';
            }
            if (!/^webapp:/i.test(webappAlt)) {
                webappAlt = 'webapp://toki01t.github.io/TstimeTPOS01M/';
            }

            var openWebApp = document.getElementById('openWebApp');
            var openShortcut = document.getElementById('openShortcut');
            var openHomeHint = document.getElementById('openHomeHint');

            openWebApp.href = webappPrimary;
            openShortcut.href = shortcutUrl;
            // ホーム画面アイコン案内。誤ってサイトへ飛ばさないよう javascript:void にする
            openHomeHint.href = '#';
            openHomeHint.addEventListener('click', function (e) {
                e.preventDefault();
                document.getElementById('status').textContent =
                    'ホーム画面の「T\'s time」アイコンをタップしてください。';
            });

            document.getElementById('webappUrl').textContent = webappPrimary;
            document.getElementById('scName').textContent = shortcutName;
            document.getElementById('target').textContent = webappPrimary;

            if (from === 'nimbot') {
                document.getElementById('title').textContent = 'NIMBOT印字が完了しました';
            }

            function tryOpenWebApp() {
                // 先に iframe で試し、だめなら同じタブで開く
                try {
                    var iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = webappPrimary;
                    document.body.appendChild(iframe);
                    setTimeout(function () {
                        try { document.body.removeChild(iframe); } catch (e) {}
                    }, 800);
                } catch (e) {}

                setTimeout(function () {
                    window.location.href = webappPrimary;
                }, 200);
            }

            // サイト(https)へは自動で飛ばさない。Webアプリ(webapp://)へ戻す
            // 1) ショートカット（作成済みならホーム画面アプリが開く）
            // 2) webapp://…/index.html（manifest の start_url に一致）
            // ※ / 終わりの別パスは「アドレスが無効」になりやすいので自動では試さない
            window.location.href = shortcutUrl;
            setTimeout(tryOpenWebApp, 900);

            setTimeout(function () {
                document.getElementById('status').textContent =
                    '自動で戻れない場合は「Webアプリに戻る」を押すか、ホーム画面のアイコンをタップしてください。';
            }, 2400);
        })();
    </script>
</body>
</html>
