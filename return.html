<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>T's time - アプリに戻る</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: #f1f5f9;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 360px;
            padding: 28px 22px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.15rem;
        }

        p {
            margin: 0 0 18px;
            color: #475569;
            font-size: 0.92rem;
            line-height: 1.7;
        }

        a.button {
            display: block;
            margin-bottom: 10px;
            padding: 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
        }

        a.button.secondary {
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 0.95rem;
            padding: 14px;
        }

        .hint {
            margin-bottom: 0;
            font-size: 0.82rem;
            color: #64748b;
        }

        details {
            margin-top: 16px;
            text-align: left;
        }

        summary {
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            color: #2563eb;
        }

        details ol {
            margin: 12px 0 0;
            padding-left: 1.2em;
            color: #475569;
            font-size: 0.82rem;
            line-height: 1.8;
        }

        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            background: #f1f5f9;
            padding: 1px 5px;
            border-radius: 5px;
            word-break: break-all;
        }

        .target {
            margin: 16px 0 0;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 0.7rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>印刷が完了しました</h1>
        <p id="status">ショートカットを開いています…</p>

        <a class="button" id="viaShortcut" href="#">ショートカットで戻る</a>
        <a class="button secondary" id="retry" href="#">直接アプリに戻る</a>
        <a class="button secondary" id="retryAlt" href="#">別の形式で戻る</a>

        <p class="hint">自動で戻れない場合は上のボタンを押してください。ホーム画面の「T's time」から開き直しても、入力内容と連番は残っています。</p>

        <details>
            <summary>初回だけ：ショートカットの作り方</summary>
            <ol>
                <li>「ショートカット」アプリを開き、右上の＋で新規作成</li>
                <li>「アクションを追加」→「URL」を選び、下のアドレスを貼り付け<br><code id="webappUrl"></code></li>
                <li>続けて「URLを開く」アクションを追加</li>
                <li>右上からショートカット名を <code id="scName"></code> に設定して完了</li>
            </ol>
        </details>

        <p class="target" id="target"></p>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var target = params.get('to') || 'webapp://toki01t.github.io/TstimeTPOS01M/';
            var alternate = params.get('alt') || '';
            var shortcutName = params.get('sc') || 'Tstime';
            var shortcutUrl = 'shortcuts://run-shortcut?name=' + encodeURIComponent(shortcutName);

            var retry = document.getElementById('retry');
            var retryAlt = document.getElementById('retryAlt');
            var viaShortcut = document.getElementById('viaShortcut');

            retry.href = target || '#';
            retryAlt.href = alternate || '#';
            if (!alternate || alternate === target) retryAlt.style.display = 'none';

            viaShortcut.href = shortcutUrl;
            document.getElementById('scName').textContent = shortcutName;
            document.getElementById('webappUrl').textContent = target;
            document.getElementById('target').textContent = shortcutUrl;

            // 印刷完了後はボタンを待たず、すぐショートカットを開く
            window.location.replace(shortcutUrl);

            setTimeout(function () {
                document.getElementById('status').textContent =
                    '自動で開けませんでした。下のボタンからお戻りください。';
            }, 1500);
        })();
    </script>
</body>
</html>
