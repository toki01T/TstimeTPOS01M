<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>T's time - アプリに戻る</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: #f1f5f9;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 360px;
            padding: 28px 22px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.15rem;
        }

        p {
            margin: 0 0 18px;
            color: #475569;
            font-size: 0.92rem;
            line-height: 1.7;
        }

        a.button {
            display: block;
            margin-bottom: 10px;
            padding: 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
        }

        a.button.secondary {
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 0.95rem;
            padding: 14px;
        }

        .hint {
            margin-bottom: 0;
            font-size: 0.82rem;
            color: #64748b;
        }

        .target {
            margin: 16px 0 0;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 0.7rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="title">印刷が完了しました</h1>
        <p id="status">アプリへ戻しています…</p>

        <a class="button" id="openApp" href="#">アプリを開く</a>
        <a class="button secondary" id="openSafari" href="#" style="display:none">Safariで開く</a>

        <p class="hint">自動で戻れない場合は「アプリを開く」を押してください。入力内容と連番はそのまま残っています。</p>

        <p class="target" id="target"></p>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var httpsApp = params.get('https') || '';
            var to = params.get('to') || '';
            var alternate = params.get('alt') || '';
            var from = params.get('from') || '';

            function toXSafari(url) {
                if (!url) return '';
                if (/^https:\/\//i.test(url)) return 'x-safari-' + url;
                if (/^http:\/\//i.test(url)) return 'x-safari-' + url;
                return url;
            }

            // 自動遷移・主ボタンは必ず https のみ（webapp:// は「アドレスが無効です」になる端末がある）
            var appUrl = '';
            if (/^https?:\/\//i.test(httpsApp)) appUrl = httpsApp;
            else if (/^https?:\/\//i.test(to)) appUrl = to;
            else if (/^https?:\/\//i.test(alternate)) appUrl = alternate;
            else appUrl = 'https://toki01t.github.io/TstimeTPOS01M/';

            var safariUrl = '';
            if (/^x-safari-/i.test(alternate)) safariUrl = alternate;
            else if (from === 'nimbot') safariUrl = toXSafari(appUrl);

            var openApp = document.getElementById('openApp');
            var openSafari = document.getElementById('openSafari');
            openApp.href = appUrl;
            document.getElementById('target').textContent = appUrl;

            if (safariUrl && safariUrl !== appUrl) {
                openSafari.style.display = 'block';
                openSafari.href = safariUrl;
            }

            if (from === 'nimbot') {
                document.getElementById('title').textContent = 'NIMBOT印字が完了しました';
            }

            // https へ確実に戻す。webapp:// や shortcuts:// は自動では開かない
            window.location.replace(appUrl);

            setTimeout(function () {
                document.getElementById('status').textContent =
                    '自動で戻れない場合は「アプリを開く」を押してください。';
            }, 1600);
        })();
    </script>
</body>
</html>
